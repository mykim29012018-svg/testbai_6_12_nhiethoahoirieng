<section id="intro" class="card"><h2>Thông tin học sinh</h2><p class="muted">Mỗi câu đúng được 0,5 điểm.</p><form id="startForm"><label for="name">Họ và tên</label><input id="name" required maxlength="100" autocomplete="name"><label for="className">Lớp</label><input id="className" required maxlength="30"><button class="primary" type="submit">Bắt đầu làm bài</button></form></section>

<script>
const BANK=[{"type": "mc", "text": "Quá trình một chất chuyển từ thể lỏng sang thể khí gọi là", "options": ["sự ngưng tụ.", "sự hóa hơi.", "sự nóng chảy.", "sự đông đặc."], "correct": 1, "explain": "Hóa hơi là sự chuyển từ thể lỏng sang thể khí.", "id": 0}, {"type": "mc", "text": "Nhiệt hóa hơi riêng của một chất lỏng ở nhiệt độ xác định là nhiệt lượng cần cung cấp để", "options": ["làm 1 kg chất lỏng tăng nhiệt độ thêm 1 °C.", "làm một lượng chất lỏng bất kì hóa hơi hoàn toàn.", "làm 1 kg chất lỏng hóa hơi hoàn toàn ở nhiệt độ đó.", "làm 1 kg chất rắn nóng chảy hoàn toàn."], "correct": 2, "explain": "Nhiệt hóa hơi riêng ứng với 1 kg chất lỏng hóa hơi hoàn toàn ở nhiệt độ xác định.", "id": 1}, {"type": "mc", "text": "Đơn vị của nhiệt hóa hơi riêng trong hệ SI là", "options": ["J/kg.", "J/(kg.K).", "J/K.", "kg/J."], "correct": 0, "explain": "Đơn vị của L là J/kg.", "id": 2}, {"type": "mc", "text": "Một lượng chất lỏng có khối lượng m, nhiệt hóa hơi riêng L. Nhiệt lượng cần cung cấp để lượng chất lỏng này hóa hơi hoàn toàn ở nhiệt độ xác định là", "options": ["Q = L/m.", "Q = m/L.", "Q = Lm².", "Q = Lm."], "correct": 3, "explain": "Nhiệt lượng hóa hơi: Q = Lm.", "id": 3}, {"type": "mc", "text": "Khi hơi nước ngưng tụ thành nước lỏng ở cùng nhiệt độ, hơi nước", "options": ["thu nhiệt từ môi trường.", "tỏa nhiệt ra môi trường.", "không trao đổi nhiệt với môi trường.", "chỉ tỏa nhiệt nếu nhiệt độ giảm."], "correct": 1, "explain": "Ngưng tụ là quá trình tỏa nhiệt.", "id": 4}, {"type": "mc", "text": "Hai ấm giống nhau chứa nước tinh khiết đang sôi ở cùng áp suất. Công suất nhiệt thực sự truyền cho nước ở ấm thứ nhất gấp đôi ấm thứ hai. Khi cả hai ấm vẫn còn nước lỏng, nhận xét nào đúng?", "options": ["Nhiệt độ nước ở ấm thứ nhất cao gấp đôi ấm thứ hai.", "Hai ấm có cùng tốc độ hóa hơi vì cùng nhiệt độ sôi.", "Hai ấm có cùng nhiệt độ nước, nhưng tốc độ hóa hơi ở ấm thứ nhất gấp đôi.", "Nhiệt hóa hơi riêng của nước ở ấm thứ nhất bằng một nửa ấm thứ hai."], "correct": 2, "explain": "Cùng áp suất thì cùng nhiệt độ sôi. Từ P = LΔm/Δt, công suất có ích gấp đôi cho tốc độ hóa hơi gấp đôi.", "id": 5}, {"type": "mc", "text": "Khi đun nước tinh khiết đang sôi ở áp suất không đổi, nhiệt độ nước không tăng dù nước tiếp tục nhận nhiệt. Cách giải thích phù hợp nhất là", "options": ["năng lượng nhận thêm chủ yếu dùng cho sự chuyển thể, làm các phân tử tách xa nhau hơn.", "nước không còn hấp thụ nhiệt sau khi đạt nhiệt độ sôi.", "toàn bộ năng lượng nhận thêm làm tăng động năng trung bình của các phân tử.", "nhiệt lượng cung cấp bị triệt tiêu hoàn toàn bởi nhiệt lượng nước tỏa ra."], "correct": 0, "explain": "Năng lượng nhận thêm dùng cho chuyển thể, không làm tăng nhiệt độ trong quá trình sôi ở áp suất không đổi.", "id": 6}, {"type": "mc", "text": "Hai chiếc khăn giống nhau được làm ướt bằng cùng lượng nước. Một chiếc được trải rộng, chiếc còn lại được gấp nhiều lớp và đặt cạnh nhau trong cùng điều kiện. Chiếc trải rộng thường khô nhanh hơn vì", "options": ["nhiệt hóa hơi riêng của nước trên khăn trải rộng nhỏ hơn.", "nước trên khăn trải rộng có nhiệt độ sôi thấp hơn.", "nước trên khăn gấp không thể bay hơi khi chưa sôi.", "diện tích tiếp xúc giữa nước và không khí lớn hơn, thuận lợi cho sự bay hơi."], "correct": 3, "explain": "Trải rộng làm tăng diện tích tiếp xúc với không khí, thúc đẩy bay hơi.", "id": 7}, {"type": "mc", "text": "Sau khi bơi, một học sinh đứng trong gió và cảm thấy lạnh dù nhiệt độ không khí cao hơn nhiệt độ nước trong hồ. Khi lau khô người, cảm giác lạnh giảm rõ rệt. Cách giải thích phù hợp nhất là", "options": ["gió làm nhiệt hóa hơi riêng của nước tăng mạnh.", "gió thúc đẩy nước trên da bay hơi và thu nhiệt; lau khô làm giảm lượng nước có thể bay hơi.", "nước trên da ngưng tụ và thu nhiệt từ cơ thể.", "lau khô làm nhiệt độ sôi của nước trên da tăng lên."], "correct": 1, "explain": "Bay hơi lấy nhiệt từ da; gió thúc đẩy quá trình này, còn lau khô làm giảm lượng nước trên da.", "id": 8}, {"type": "mc", "text": "Xét cùng khối lượng hơi nước và nước lỏng, đều ở 100 °C. Nếu hơi nước ngưng tụ hoàn toàn rồi lượng nước tạo thành nguội đến 40 °C, còn nước lỏng cũng nguội đến 40 °C, thì", "options": ["hai phần tỏa nhiệt bằng nhau vì có cùng khối lượng và độ giảm nhiệt độ.", "nước lỏng tỏa nhiệt nhiều hơn vì không cần chuyển thể.", "phần hơi nước tỏa nhiệt nhiều hơn một lượng bằng mL.", "phần hơi nước chỉ tỏa nhiệt trong giai đoạn ngưng tụ."], "correct": 2, "explain": "Cả hai cùng tỏa mc(100 − 40); phần hơi còn tỏa thêm mL khi ngưng tụ.", "id": 9}, {"type": "mc", "text": "Một hệ thống sưởi dùng hơi nước dẫn qua các ống kim loại. Hơi nước ngưng tụ trong ống, còn nước tạo thành sau khi hơi nước ngưng tụ được đưa ra ngoài ở gần nhiệt độ ngưng tụ. Hệ thống vẫn truyền được nhiều nhiệt cho căn phòng chủ yếu vì", "options": ["hơi nước tỏa nhiệt lượng lớn khi chuyển thành nước lỏng, dù nhiệt độ gần như không đổi.", "nhiệt độ hơi nước tăng mạnh trong quá trình ngưng tụ.", "nước tạo thành sau khi hơi nước ngưng tụ thu nhiệt từ thành ống rồi truyền vào phòng.", "hơi nước chỉ truyền nhiệt khi chưa ngưng tụ."], "correct": 0, "explain": "Hơi ngưng tụ tỏa nhiệt lượng mL ngay cả khi nhiệt độ không giảm.", "id": 10}, {"type": "mc", "text": "Hai chất lỏng A và B đang ở nhiệt độ sôi tương ứng. Cung cấp cùng nhiệt lượng có ích cho mỗi chất thì khối lượng chất A hóa hơi gấp đôi chất B. Nhận xét nào đúng?", "options": ["L<sub>A</sub> = 2L<sub>B</sub>.", "L<sub>A</sub> = L<sub>B</sub>.", "L<sub>A</sub> = 4L<sub>B</sub>.", "L<sub>A</sub> = L<sub>B</sub>/2."], "correct": 3, "explain": "Với cùng Q, L = Q/m; khối lượng hóa hơi gấp đôi thì L bằng một nửa.", "id": 11}, {"type": "mc", "text": "Một học sinh cho rằng: “Chất lỏng có nhiệt hóa hơi riêng lớn hơn luôn bay hơi chậm hơn trong mọi điều kiện”. Nhận xét nào phù hợp?", "options": ["Đúng, vì tốc độ bay hơi chỉ phụ thuộc vào nhiệt hóa hơi riêng.", "Chưa đúng, vì tốc độ bay hơi còn phụ thuộc vào nhiệt độ, diện tích mặt thoáng, độ ẩm và sự chuyển động của không khí.", "Đúng, vì chất có nhiệt hóa hơi riêng lớn hơn luôn có nhiệt độ sôi cao hơn.", "Chưa đúng, vì nhiệt hóa hơi riêng tăng theo khối lượng chất lỏng."], "correct": 1, "explain": "Không thể kết luận tốc độ bay hơi chỉ từ nhiệt hóa hơi riêng.", "id": 12}, {"type": "mc", "text": "Trong thí nghiệm đo nhiệt hóa hơi riêng của nước, học sinh dùng công thức L = PΔt/Δm. Một phần điện năng bị thất thoát ra môi trường, còn khối lượng nước giảm chỉ do hóa hơi. Nếu bỏ qua thất thoát này, giá trị L tính được sẽ", "options": ["nhỏ hơn giá trị thực vì khối lượng nước hóa hơi giảm.", "bằng giá trị thực vì nhiệt độ nước không đổi.", "lớn hơn giá trị thực vì điện năng cung cấp lớn hơn nhiệt lượng thực sự dùng để hóa hơi.", "không thay đổi vì công suất và thời gian đều được đo chính xác."], "correct": 2, "explain": "Dùng toàn bộ điện năng thay cho nhiệt lượng hóa hơi làm tử số lớn hơn thực tế.", "id": 13}, {"type": "mc", "text": "Khi nấu thức ăn bằng nước trong nồi mở ở vùng núi cao, áp suất khí quyển thấp hơn ở đồng bằng. Với cùng loại thức ăn và điều kiện chế biến tương tự, tính từ khi nước bắt đầu sôi, thức ăn thường cần thời gian lâu hơn để chín. Cách giải thích nào phù hợp nhất?", "options": ["Nước sôi ở nhiệt độ thấp hơn, nên thức ăn được làm nóng ở nhiệt độ thấp hơn.", "Nước sôi ở nhiệt độ cao hơn, nên nhiệt lượng truyền cho thức ăn giảm.", "Nước đã sôi thì không còn truyền nhiệt cho thức ăn.", "Áp suất thấp làm nước không thể hóa hơi dù được đun liên tục."], "correct": 0, "explain": "Áp suất bên ngoài giảm làm nhiệt độ sôi của nước giảm. Trong nồi mở ở vùng núi cao, nước đang sôi có nhiệt độ thấp hơn so với ở đồng bằng, nên thức ăn thường cần thời gian lâu hơn để chín.", "id": 14}, {"type": "mc", "text": "Trong thiết bị chưng cất, nước được đun thành hơi, sau đó hơi đi qua bộ phận làm lạnh và ngưng tụ thành nước cất. Nếu lượng nước làm mát chảy qua bộ phận này quá ít, một phần hơi có thể thoát ra mà chưa ngưng tụ. Nguyên nhân phù hợp nhất là", "options": ["nước làm mát làm tăng nhiệt hóa hơi riêng của hơi nước.", "hơi nước cần được cung cấp thêm nhiệt để ngưng tụ.", "hơi nước chỉ ngưng tụ khi được làm lạnh đến 0 °C.", "bộ phận làm lạnh chưa lấy đi đủ nhiệt lượng cần thiết để hơi ngưng tụ hoàn toàn."], "correct": 3, "explain": "Muốn hơi ngưng tụ hoàn toàn, bộ phận làm lạnh phải lấy đi đủ nhiệt lượng.", "id": 15}, {"type": "short", "text": "Một thiết bị tạo hơi chứa 0,20 kg nước ở 25 °C. Thiết bị đun toàn bộ lượng nước đến 100 °C, sau đó làm 0,05 kg nước hóa hơi ở nhiệt độ này. Biết nhiệt dung riêng của nước là 4200 J/(kg.K), nhiệt hóa hơi riêng ở 100 °C là 2,26·10<sup>6</sup> J/kg. Bỏ qua nhiệt lượng làm nóng thiết bị, thất thoát nhiệt và lượng nước bay hơi trước khi sôi. Nhiệt lượng cần cung cấp cho nước bằng bao nhiêu kJ?", "correct": 176, "unit": "kJ", "explain": "Q₁ = 0,20·4200·(100 − 25) = 63 000 J. Q₂ = 2,26·10⁶·0,05 = 113 000 J. Q = Q₁ + Q₂ = 176 000 J = 176 kJ.", "graph": false, "id": 16}, {"type": "short", "text": "Một thiết bị chưng cất dùng bộ đốt điện có công suất 800 W. Khi nước đã sôi ổn định ở 100 °C, có 75% điện năng tiêu thụ được dùng để hóa hơi nước. Biết nhiệt hóa hơi riêng của nước là 2,26·10<sup>6</sup> J/kg. Thời gian cần để thu được 0,12 kg hơi nước bằng bao nhiêu giây?", "correct": 452, "unit": "s", "explain": "P có ích = 0,75·800 = 600 W. t = Lm/P có ích = 2,26·10⁶·0,12/600 = 452 s.", "graph": false, "id": 17}, {"type": "short", "text": "Một thiết bị làm nóng nước bằng cách dẫn hơi nước ở 100 °C vào bình chứa 0,50 kg nước ở 20 °C. Hơi nước ngưng tụ hoàn toàn, hòa vào nước trong bình và nhiệt độ cân bằng cuối cùng là 40 °C. Biết nhiệt dung riêng của nước là 4200 J/(kg.K), nhiệt hóa hơi riêng ở 100 °C là 2,26·10<sup>6</sup> J/kg. Bỏ qua nhiệt lượng bình hấp thụ và thất thoát ra môi trường. Khối lượng hơi nước đã ngưng tụ bằng bao nhiêu gam? Làm tròn đến một chữ số thập phân.", "correct": 16.7, "unit": "g", "explain": "Hơi tỏa nhiệt khi ngưng tụ và khi lượng nước tạo thành sau khi hơi nước ngưng tụ nguội từ 100 °C xuống 40 °C: m[L + c(100 − 40)] = 0,50·4200·(40 − 20). m = 42 000/2 512 000 kg ≈ 16,7 g.", "graph": false, "id": 18}, {"type": "short", "text": "Một nhóm học sinh đo nhiệt hóa hơi riêng của nước bằng dây đốt điện có công suất không đổi 230 W. Nước đã sôi ổn định khi bắt đầu tính thời gian. Đồ thị biểu diễn khối lượng nước còn lại m theo thời gian t như hình dưới. Coi toàn bộ điện năng dùng để hóa hơi nước; khối lượng nước giảm chỉ do hóa hơi. Nhiệt hóa hơi riêng của nước bằng bao nhiêu MJ/kg?", "correct": 2.3, "unit": "MJ/kg", "explain": "Trong 600 s: Δm = 120 − 60 = 60 g = 0,060 kg. L = PΔt/Δm = 230·600/0,060 = 2,3·10⁶ J/kg = 2,3 MJ/kg.", "graph": true, "id": 19}];

const ENDPOINT='https://script.google.com/macros/s/AKfycbw2Ubb_OQJ2jxi2wg-UsxhuW_12tJ5yU3TxHWyDFNlzQDN3ijW79v72uWN0aESEKMM3AQ/exec';
const $=id=>document.getElementById(id);
let submissionId='';
function sendResult(payload){
 const body=new URLSearchParams(payload);
 let queued=false;
 try{if(navigator.sendBeacon)queued=navigator.sendBeacon(ENDPOINT,body)}catch(e){}
 if(queued){$('sendStatus').textContent='Đã gửi yêu cầu lưu điểm. Giáo viên kiểm tra kết quả trên bảng tính.';return}
 $('sendStatus').textContent='Đang gửi điểm…';
 fetch(ENDPOINT,{method:'POST',mode:'no-cors',body,keepalive:true}).then(()=>{
 $('sendStatus').textContent='Đã gửi yêu cầu lưu điểm. Giáo viên kiểm tra kết quả trên bảng tính.';
 }).catch(()=>{
 $('sendStatus').textContent='Chưa gửi được điểm. Kiểm tra kết nối mạng rồi nhấn Gửi lại.';
 const b=document.createElement('button');b.textContent='Gửi lại điểm';b.onclick=()=>{b.remove();sendResult(payload)};$('sendStatus').append(b);
 });
}

let questions=[],responses={},position=0,active=false,finished=false,deadline=0,started=0,interval,studentName='',studentClass='';
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepare(){return [...shuffle(BANK.filter(q=>q.type==='mc')), ...shuffle(BANK.filter(q=>q.type==='short'))].map(q=>({...q,order:q.type==='mc'?shuffle([0,1,2,3]):[]}))}
function answered(q){return q.type==='mc'?Number.isInteger(responses[q.id]):typeof responses[q.id]==='string'&&responses[q.id].trim()!==''}
function parseNumeric(v){const s=String(v??'').trim().replace(',','.');return /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN}
function correct(q){return q.type==='mc'?responses[q.id]===q.correct:Math.abs(parseNumeric(responses[q.id])-q.correct)<1e-8}
function updateMap(){const n=questions.filter(answered).length;$('count').textContent=`Đã trả lời ${n}/20 câu`;$('map').replaceChildren();questions.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=(answered(q)?'answered ':'')+(i===position?'current':'');b.setAttribute('aria-label',`Câu ${i+1}${answered(q)?', đã trả lời':''}`);b.onclick=()=>{if(checkTime()){position=i;render()}};$('map').append(b)})}
function render(){if(!active)return;const q=questions[position];$('part').textContent=q.type==='mc'?'Phần I · Trắc nghiệm':'Phần II · Trả lời ngắn';$('progress').textContent=`${position+1} / 20`;$('number').textContent=`Câu ${position+1}`;$('question').innerHTML=q.text;if(q.graph){const im=document.createElement('img');im.src=GRAPH;im.alt='Đồ thị: khối lượng nước giảm từ 120 g lúc 0 s đến 60 g lúc 600 s.';im.className='graph';$('question').append(im)}$('answers').replaceChildren();if(q.type==='mc'){q.order.forEach((o,i)=>{const b=document.createElement('button');b.className='option'+(responses[q.id]===o?' selected':'');b.setAttribute('aria-pressed',responses[q.id]===o);b.innerHTML=`<span class="letter">${'ABCD'[i]}.</span><span>${q.options[o]}</span>`;b.onclick=()=>{if(checkTime()){responses[q.id]=o;render()}};$('answers').append(b)})}else{const lab=document.createElement('label');lab.htmlFor='numeric';lab.textContent=`Kết quả (${q.unit})`;const inp=document.createElement('input');inp.id='numeric';inp.type='text';inp.inputMode='decimal';inp.autocomplete='off';inp.placeholder='Nhập số, ví dụ: 16,7';inp.value=responses[q.id]??'';inp.oninput=()=>{if(checkTime()){responses[q.id]=inp.value;updateMap()}};const hint=document.createElement('p');hint.className='muted';hint.textContent='Chỉ nhập số, không nhập đơn vị. Chấp nhận dấu phẩy hoặc dấu chấm thập phân.';$('answers').append(lab,inp,hint)}$('prev').disabled=position===0;$('next').disabled=position===19;updateMap()}
function checkTime(){if(!active)return false;if(Date.now()>=deadline){finish('Hết thời gian làm bài. Bài đã được tự động nộp.');return false}return true}
function tick(){if(!checkTime())return;const s=Math.ceil((deadline-Date.now())/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('timer').classList.toggle('low',s<=120)}
$('startForm').onsubmit=e=>{e.preventDefault();studentName=$('name').value.trim();studentClass=$('className').value.trim();if(!studentName||!studentClass){alert('Vui lòng nhập họ tên và lớp.');return}questions=prepare();responses={};position=0;submissionId=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);started=Date.now();deadline=started+15*60*1000;active=true;$('intro').hidden=true;$('exam').hidden=false;$('student').textContent=studentName+' · '+studentClass;render();tick();interval=setInterval(tick,250)};
$('prev').onclick=()=>{if(checkTime()&&position>0){position--;render()}};$('next').onclick=()=>{if(checkTime()&&position<19){position++;render()}};
$('submit').onclick=()=>{if(!checkTime())return;const left=20-questions.filter(answered).length;$('confirmText').textContent=left?`Bạn còn ${left} câu chưa trả lời. Sau khi nộp, bạn không thể sửa đáp án.`:'Sau khi nộp, bạn không thể sửa đáp án.';$('confirm').showModal()};$('cancel').onclick=()=>$('confirm').close();$('confirmSubmit').onclick=()=>{if(checkTime())finish('Học sinh chủ động nộp bài.')};
function finish(reason){if(!active||finished)return;active=false;finished=true;clearInterval(interval);$('confirm').close();$('exam').hidden=true;$('result').hidden=false;const n=questions.filter(correct).length;$('resultStudent').textContent=studentName+' · Lớp '+studentClass;$('score').textContent=(n*0.5).toFixed(1).replace('.',',')+' / 10';const seconds=Math.min(900,Math.max(0,Math.floor((Date.now()-started)/1000)));$('summary').textContent=`Đúng ${n}/20 câu · Đã trả lời ${questions.filter(answered).length}/20 câu · Thời gian: ${Math.floor(seconds/60)} phút ${seconds%60} giây`;$('reason').textContent=reason;sendResult({submissionId,name:studentName,className:studentClass,correct:String(n),total:'20',answered:String(questions.filter(answered).length),duration:String(seconds),reason});window.scrollTo(0,0)}
document.addEventListener('visibilitychange',()=>{if(active&&document.hidden)finish('Trang làm bài đã bị ẩn do chuyển tab, thu nhỏ trình duyệt hoặc chuyển ứng dụng. Bài đã được tự động nộp.')});window.addEventListener('pagehide',()=>{if(active)finish('Bạn đã rời trang làm bài. Bài được kết thúc.')});
</script></main></body></html>
